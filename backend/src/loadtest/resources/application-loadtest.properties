# Packaged exclusively in loadtest.jar. No .env or real service credentials.
spring.datasource.url=jdbc:mysql://mysql:3306/musicpets_loadtest?rewriteBatchedStatements=true
spring.datasource.username=musicpets_loadtest
spring.datasource.password=local-loadtest-only
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.data.redis.url=redis://redis:6379
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5
spring.security.oauth2.client.registration.spotify.client-id=local-fixture
spring.security.oauth2.client.registration.spotify.client-secret=local-fixture
spring.security.oauth2.client.registration.spotify.redirect-uri=http://127.0.0.1:18080/login/oauth2/code/spotify
lastfm.api-key=local-fixture
gemini.api-key=local-fixture
jwt.secret=local-loadtest-only-do-not-use-in-production-01234567890123456789
app.auth.cookie-secure=false
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
