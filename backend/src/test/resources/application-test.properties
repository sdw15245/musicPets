spring.datasource.url=jdbc:h2:mem:musicpets-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Fast service tests use H2; migrationTest covers the production SQL on real MySQL.
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.security.oauth2.client.registration.spotify.client-id=test-client
spring.security.oauth2.client.registration.spotify.client-secret=test-secret
lastfm.api-key=test-key
gemini.api-key=test-key
app.auth.cookie-secure=false
jwt.secret=test-secret-test-secret-test-secret-test-secret-test-secret
app.rate-limit.enabled=false
app.music-cache.enabled=false
