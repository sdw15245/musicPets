# Standalone deployment file. Do not merge with the local compose.yaml.
name: musicpets-production

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    image: nginx:1.28-alpine
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/logging.conf:/etc/nginx/conf.d/logging.conf:ro
      - ./deploy/nginx/routes.conf:/etc/nginx/musicpets/routes.conf:ro
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
    mem_limit: 64m
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to an image tag}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql:3306/musicpets
      DB_USERNAME: musicpets
      DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      REDIS_URL: redis://redis:6379
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?Set SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?Set SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: https://${DOMAIN:?Set DOMAIN}/login/oauth2/code/spotify
      APP_CORS_ALLOWED_ORIGINS: ${APP_ORIGIN:?Set APP_ORIGIN}
      APP_OAUTH2_SUCCESS_REDIRECT: ${APP_ORIGIN}/oauth/callback
      APP_OAUTH2_FAILURE_REDIRECT: ${APP_ORIGIN}/login?oauthError=spotify
      AUTH_COOKIE_SECURE: "true"
      LASTFM_API_KEY: ${LASTFM_API_KEY:?Set LASTFM_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:?Set GOOGLE_API_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=50.0 -XX:+ExitOnOutOfMemoryError"
      SERVER_TOMCAT_THREADS_MAX: "50"
      SERVER_TOMCAT_THREADS_MINSPARE: "5"
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "2"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "3", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: 768m
    stop_grace_period: 40s
    logging: *logging

  mysql:
    image: mysql:8.0.43
    # Keep database caches and connections bounded on the 2 GiB EC2 host.
    command: ["--innodb-buffer-pool-size=128M", "--max-connections=30", "--performance-schema=OFF"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: musicpets
      MYSQL_USER: musicpets
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u musicpets -D musicpets -e "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    mem_limit: 128m
    logging: *logging

volumes:
  mysql-data:
