client_max_body_size 1m;

# Re-resolve after replacing the backend container.
resolver 127.0.0.11 valid=10s ipv6=off;
set $backend http://backend:8080;

location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

location ~ ^/(api(?:/|$)|oauth2/|login/oauth2/) {
    proxy_pass $backend$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    # Do not trust arbitrary client-supplied forwarding headers.
    # With Vercel in front, the peer is Vercel, not necessarily the end user.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port "";
    proxy_set_header X-Forwarded-Prefix "";
    proxy_set_header Forwarded "";
    proxy_set_header Connection "";
    # Redirects already use the configured public callback; never rewrite them to DuckDNS.
    proxy_redirect off;
    proxy_read_timeout 120s;
    proxy_buffering off;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
}

# No frontend or public management routes on the backend origin.
location / { return 404; }
