spring.application.name=backend

# DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway owns schema changes. Existing databases need an explicit, verified baseline.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.sql.init.mode=never

# Public Last.fm metadata cache. Failure falls back to direct API lookup.
app.music-cache.enabled=${MUSIC_CACHE_ENABLED:true}
app.music-cache.tags-ttl=7d
app.music-cache.metadata-ttl=1d
app.music-cache.empty-ttl=10m
app.music-cache.retry-delay=30s
spring.data.redis.repositories.enabled=false
spring.data.redis.url=${REDIS_URL:redis://127.0.0.1:6379}
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=300ms

# Spotify OAuth2
spring.security.oauth2.client.registration.spotify.client-id=${SPOTIFY_CLIENT_ID}
spring.security.oauth2.client.registration.spotify.client-secret=${SPOTIFY_CLIENT_SECRET}
spring.security.oauth2.client.registration.spotify.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.spotify.redirect-uri=${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/login/oauth2/code/spotify}
spring.security.oauth2.client.registration.spotify.scope[0]=user-read-private
spring.security.oauth2.client.registration.spotify.scope[1]=user-read-email
spring.security.oauth2.client.registration.spotify.scope[2]=user-top-read
spring.security.oauth2.client.registration.spotify.scope[3]=playlist-modify-public
spring.security.oauth2.client.registration.spotify.client-name=Spotify

spring.security.oauth2.client.provider.spotify.authorization-uri=https://accounts.spotify.com/authorize
spring.security.oauth2.client.provider.spotify.token-uri=https://accounts.spotify.com/api/token
spring.security.oauth2.client.provider.spotify.user-info-uri=https://api.spotify.com/v1/me
spring.security.oauth2.client.provider.spotify.user-name-attribute=id

# App
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173}
app.oauth2.success-redirect=${APP_OAUTH2_SUCCESS_REDIRECT:http://127.0.0.1:5173/oauth/callback}
app.oauth2.failure-redirect=${APP_OAUTH2_FAILURE_REDIRECT:http://127.0.0.1:5173/login?oauthError=spotify}
# Only local HTTP development sets AUTH_COOKIE_SECURE=false.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}

# Last.fm
lastfm.api-key=${LASTFM_API_KEY}
lastfm.base-url=https://ws.audioscrobbler.com/2.0/

# Gemini (Google AI Studio)
gemini.api-key=${GOOGLE_API_KEY}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
gemini.model=gemini-2.5-flash

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.access=${JWT_ACCESS_EXPIRATION:1800000}
jwt.expiration.refresh=${JWT_REFRESH_EXPIRATION:604800000}

# Per-instance admission budgets. Configure per-operation user-per-minute/ip-per-minute as needed.
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.max-buckets=${APP_RATE_LIMIT_MAX_BUCKETS:20000}
app.rate-limit.max-concurrent-external=${APP_RATE_LIMIT_MAX_CONCURRENT_EXTERNAL:8}

